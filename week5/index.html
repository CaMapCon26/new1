<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Users Table</title>
	<style>
		body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; }
		table { width: 100%; border-collapse: collapse; }
		th, td { border: 1px solid #1e1b1b; padding: 8px; text-align: left; }
		th { background: #6d72c2; color: white; }
	</style>
</head>
<body>
	<h1>Fetch Table User from API</h1>
	<table>
		<thead>
			<tr>
				<th>ID</th>
				<th>Name</th>
				<th>Username</th>
				<th>Email</th>
                <th>Address</th>
			</tr>
		</thead>
		<tbody id="usersBody">
			<tr><td colspan="5">Loading...</td></tr>
		</tbody>
	</table>

	<script>
		async function loadUsers() {
			const usersBody = document.getElementById('usersBody');

			try {
				const response = await fetch('https://jsonplaceholder.typicode.com/users');
				const users = await response.json();
				usersBody.innerHTML = users.map(user => `
					<tr>
						<td>${user.id}</td>
						<td>${user.name}</td>
						<td>${user.username}</td>
						<td>${user.email}</td>
                        <td>${user.address.street}, ${user.address.suite}, ${user.address.city}, ${user.address.zipcode}</td>
					</tr>
				`).join('');
			} catch (error) {
				usersBody.innerHTML = `<tr><td colspan="4">${error.message}</td></tr>`;
			}
		}

		loadUsers();
	</script>
	<script src="app.js"></script>
</body>
</html>
